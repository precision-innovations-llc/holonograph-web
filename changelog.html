<style>
  .current{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:clamp(16px,3vh,32px) 0 clamp(24px,4vh,40px)}
  .cur-card{border:1px solid var(--line);border-radius:16px;background:#fff;padding:clamp(20px,3vw,28px);display:flex;align-items:baseline;gap:16px}
  .cur-card .meta{flex:1}
  .cur-card .track{font-family:var(--mono);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
  .cur-card .track b{color:var(--ink);font-weight:600}
  .cur-card .sub{margin-top:3px;font-size:12.5px;color:var(--ink-3)}
  .cur-card .ver{font-size:30px;font-weight:600;letter-spacing:-.02em;font-family:var(--mono)}
  .cur-card .ver .v{color:var(--iris)}
  .cur-card a.npm{font-size:12.5px;color:var(--iris);text-decoration:none}

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:clamp(40px,6.5vw,88px);padding-bottom:clamp(40px,7vh,72px)}
  .col > h2{display:flex;align-items:baseline;gap:10px;font-size:15px;font-weight:600;padding-bottom:14px;border-bottom:2px solid var(--line)}
  .col > h2 .dot{width:9px;height:9px;border-radius:3px}
  .col.lens > h2 .dot{background:var(--iris)} .col.sdk > h2 .dot{background:var(--sun)}
  .col > h2 .sub{margin-left:auto;font-family:var(--mono);font-size:11.5px;font-weight:400;color:var(--ink-3);letter-spacing:.03em}
  .rel{padding:22px 0;border-bottom:1px solid var(--line)}
  .rel .top{display:flex;align-items:baseline;gap:12px}
  .rel .ver{font-family:var(--mono);font-size:17px;font-weight:600}
  .rel .date{font-size:12.5px;color:var(--ink-3);margin-left:auto}
  .rel h3{margin-top:8px;font-size:16px;font-weight:600;letter-spacing:-.005em;display:flex;align-items:center;gap:9px}
  .rel .draft{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--catch-ink);border:1px solid var(--catch-ink);border-radius:20px;padding:2px 8px}
  .rel ul{list-style:none;margin-top:11px;display:flex;flex-direction:column;gap:8px}
  .rel li{position:relative;padding-left:18px;font-size:14px;color:var(--ink-2);line-height:1.5}
  .rel li::before{content:"";position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:50%;background:var(--ink-3)}
  .empty{padding:30px 0;color:var(--ink-3);font-size:14px}
  .rel-more[hidden]{display:none}
  .more-btn{margin-top:20px;width:100%;padding:12px;font-family:var(--mono);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);background:#fff;border:1px solid var(--line);border-radius:10px;cursor:pointer;transition:border-color .15s ease,color .15s ease}
  .more-btn:hover{border-color:var(--iris);color:var(--iris)}
  @media (max-width:860px){ .current,.cols{grid-template-columns:1fr} }
</style>
</head>
<body data-nav="">
<a class="skip" href="#main">Skip to content</a>
<header id="siteHeader"></header>

<main class="wrap" id="main">
  <section class="page-hero" data-hero data-reveal>
    <p class="eyebrow"><span class="dot"></span>Changelog</p>
    <h1>Holonograph Changelog</h1>
    <p class="sub">A history of all Holonograph and SDK updates.</p>
  </section>

  <section class="current" id="current" data-reveal></section>
  <section class="cols" id="cols" data-reveal></section>
</main>

<footer id="siteFooter"></footer>
<script src="site.js"></script>
<script src="nigel.js?v=15"></script>
<script src="mobilenav.js"></script>
<script>
(function(){
  var curEl=document.getElementById('current'), colsEl=document.getElementById('cols');
  function cmp(a,b){ var x=a.split('.').map(Number), y=b.split('.').map(Number); for(var i=0;i<3;i++){ if((x[i]||0)!==(y[i]||0)) return (x[i]||0)-(y[i]||0); } return 0; }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // #current/#cols are [data-reveal] but get filled async here — reveal them
  // directly instead of relying on the scroll observer, which never fires on a
  // section taller than the viewport (the release history is ~10000px tall).
  function show(){ curEl.classList.add('is-in'); colsEl.classList.add('is-in'); }

  fetch('changelog.json').then(function(r){ return r.json(); }).then(function(data){
    var tracks=data.tracks||{}, rels=(data.releases||[]).slice();
    var order=Object.keys(tracks);
    show();

    // current per track = highest semver present
    var current={};
    rels.forEach(function(r){ if(!current[r.track] || cmp(r.version,current[r.track].version)>0) current[r.track]=r; });
    curEl.innerHTML = order.map(function(key){
      var t=tracks[key], c=current[key]; if(!c) return '';
      var npm=t.npm ? '<a class="npm" href="'+t.npm+'" target="_blank" rel="noopener">npm &#8599;</a>' : '';
      return '<div class="cur-card"><div class="meta">'+
        '<div class="track">Current <b>'+esc(t.name)+'</b></div>'+
        '<div class="sub">'+esc(t.sub||'')+'</div>'+
        '<div class="ver">v<span class="v">'+esc(c.version)+'</span></div></div>'+npm+'</div>';
    }).join('');

    // one column per track, releases newest first
    function relHtml(r){
      var draft=r.draft ? '<span class="draft">draft</span>' : '';
      var notes=(r.notes||[]).map(function(n){ return '<li>'+esc(n)+'</li>'; }).join('');
      return '<article class="rel"><div class="top"><span class="ver">v'+esc(r.version)+'</span><span class="date">'+esc(r.date)+'</span></div>'+
        '<h3>'+esc(r.title||'')+' '+draft+'</h3><ul>'+notes+'</ul></article>';
    }
    var LIMIT=10;   // collapse each column past this so the page doesn't grow unbounded
    colsEl.innerHTML = order.map(function(key){
      var t=tracks[key];
      var mine=rels.filter(function(r){ return r.track===key; }).sort(function(a,b){ return cmp(b.version,a.version); });
      var body;
      if(!mine.length){ body='<p class="empty">No releases yet.</p>'; }
      else {
        var rest=mine.slice(LIMIT);
        body=mine.slice(0,LIMIT).map(relHtml).join('') + (rest.length
          ? '<div class="rel-more" hidden>'+rest.map(relHtml).join('')+'</div>'+
            '<button class="more-btn" type="button" data-more>Show '+rest.length+' more &darr;</button>'
          : '');
      }
      return '<div class="col '+esc(key)+'"><h2><span class="dot"></span>'+esc(t.name)+'<span class="sub">'+esc(t.sub||'')+'</span></h2>'+body+'</div>';
    }).join('');

    // expand a column's remaining releases on demand
    colsEl.addEventListener('click', function(e){
      var btn=e.target.closest && e.target.closest('[data-more]'); if(!btn) return;
      var more=btn.closest('.col').querySelector('.rel-more');
      if(more){ more.hidden=false; var first=more.querySelector('.rel'); if(first){ first.setAttribute('tabindex','-1'); first.focus(); } }
      btn.remove();
    });
  }).catch(function(){ show(); curEl.innerHTML='<p class="empty">Could not load changelog.json.</p>'; });
})();
</script>
</body>
