<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share card</title>
<!-- Template for scripts/build-og.mjs. Not deployed. ?title=&eyebrow= -->
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
<style>
  :root{--paper:#f6f5f9;--ink:#17161d;--ink-3:#6c6a78;--iris:#5f3ddc;--sun:#e9552b;--line:#e4e1ee;
    --sans:"Helvetica Neue",-apple-system,system-ui,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden;background:var(--paper)}
  body{position:relative;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
  .stage{position:absolute;top:-45px;right:-70px;width:720px;height:720px}
  #holon-lite{position:absolute;inset:0;width:100%;height:100%;display:block}
  .wash{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(90deg,var(--paper) 0%,var(--paper) 46%,rgba(246,245,249,.85) 54%,rgba(246,245,249,0) 66%)}
  .card{position:absolute;inset:0;padding:64px 72px;display:flex;flex-direction:column}
  .brand{display:flex;align-items:baseline;gap:18px}
  .mark{font-family:var(--mono);font-size:22px;letter-spacing:.34em;font-weight:500}
  .mark b{color:var(--sun);font-weight:500}
  .mark sup{font-size:.5em;letter-spacing:0;margin-left:-.3em;color:var(--ink-3)}
  .pp{font-family:var(--mono);font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3)}
  .main{margin-top:auto;margin-bottom:auto;max-width:640px}
  .eyebrow{font-family:var(--mono);font-size:17px;letter-spacing:.2em;text-transform:uppercase;color:var(--iris);display:flex;align-items:center;gap:12px}
  .eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--sun);display:inline-block}
  h1{margin-top:22px;font-size:62px;line-height:1.08;letter-spacing:-.022em;font-weight:600}
  h1.long{font-size:52px}
  .url{font-family:var(--mono);font-size:16px;letter-spacing:.12em;color:var(--ink-3)}
</style>
</head>
<body>
<div class="stage"><canvas id="holon-lite"></canvas></div>
<div class="wash"></div>
<div class="card">
  <div class="brand"><span class="mark"><b>H</b>OLONOGRAPH<sup>&trade;</sup></span><span class="pp">patent pending</span></div>
  <div class="main">
    <p class="eyebrow"><i></i><span id="eyebrow"></span></p>
    <h1 id="title"></h1>
  </div>
  <div class="url">holonograph.ai</div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const title = q.get('title') || '';
  document.getElementById('title').textContent = title;
  document.getElementById('eyebrow').textContent = q.get('eyebrow') || '';
  if (title.length > 52) document.getElementById('title').className = 'long';
</script>
<script type="module" src="/holon-light.js"></script>
</body>
</html>
